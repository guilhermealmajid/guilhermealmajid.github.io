<input
  type="text"
  id="ticket"
  placeholder="Digite o Ticket"
  inputmode="numeric"
  style="font-size:32px;
         padding:15px;
         width:300px;
         border-radius:12px;
         margin-bottom:20px;"
>

<br>

<a
  id="botaoDiscar"
  href="#"
  style="display:inline-block;
         padding:36px 60px;
         background:#2196F3;
         color:white;
         text-decoration:none;
         border-radius:24px;
         font-size:48px;"
>
  🎫 Inserir Ticket na Fila - Ativação 📞
</a>

<script>
const prefixo = "tel:08007218004,,1,,";
const sufixo  = ",,,,1";

const ticket = document.getElementById("ticket");
const botao  = document.getElementById("botaoDiscar");

botao.addEventListener("click", function (e) {
    const numero = ticket.value.trim();

    if (!numero) {
        e.preventDefault();
        alert("Digite o número do Ticket.");
        return;
    }

    this.href = prefixo + numero + sufixo;
});
</script>
